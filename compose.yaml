# Copy config.docker.example.json to deploy/config.json and set independent
# write_token (32+ bytes) and basic_password (8+ bytes) before starting.
# For PostgreSQL copy config.postgres.example.json to the SAME path instead.
# Host config: UID:GID 10001:10001, mode 0600; data uses a persistent named volume.
# deploy/ is private host state, excluded from Git and the image build context.
services:
  worklog:
    build: .
    image: worklog:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:12450:12450"
    volumes:
      - type: bind
        source: ./deploy/config.json
        target: /app/config/config.json
        read_only: true
        bind:
          create_host_path: false
      - worklog-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  worklog-data:
