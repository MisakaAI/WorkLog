# docker compose -f compose.yaml -f compose.postgres.yaml up --build -d
services:
  worklog:
    environment:
      WORKLOG_DB_DRIVER: postgres
      WORKLOG_DB_DSN: postgres://worklog:${WORKLOG_POSTGRES_PASSWORD:?Set a URL-safe PostgreSQL password}@postgres:5432/worklog?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: worklog
      POSTGRES_DB: worklog
      POSTGRES_PASSWORD: ${WORKLOG_POSTGRES_PASSWORD:?Set a URL-safe PostgreSQL password}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklog -d worklog"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
