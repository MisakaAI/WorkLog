name: Tests and Release
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  macos-desktop:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - name: Select and validate the pushed release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Only alter this disposable checkout, never remote tags. This makes
          # git describe deterministic when several tags point at the same commit.
          while IFS= read -r tag; do
            if [ "$tag" != "$RELEASE_TAG" ]; then git tag -d -- "$tag"; fi
          done < <(git tag --list)
          test "v$(bash scripts/release-version.sh)" = "$RELEASE_TAG"
      - name: Build native AppKit bundle and DMG
        run: bash scripts/build-macos.sh
      - name: Check DMG contents and architecture
        run: |
          for image in bin/worklog-v*-macos-*.dmg; do
            bash scripts/test-macos-dmg.sh "$image"
          done
      - run: go vet -tags desktop ./...
      - run: go test -race -tags desktop ./...
      - name: Upload macOS release artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runner }}
          path: bin/worklog-v*-macos-*.dmg
          if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: worklog_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: worklog_test
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    # Test harness inputs only; Worklog itself reads JSON configuration.
    env:
      WORKLOG_TEST_POSTGRES_DSN: postgres://worklog_test:test_only_password@127.0.0.1:55432/worklog_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test tag-based release version resolution
        run: bash scripts/test-release-version.sh
      - name: Test Linux packaging and installation scripts
        run: bash scripts/test-linux.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - name: Validate JSON-file deployment manifests
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.postgres.yaml config --quiet
      - run: go vet ./...
      - run: go test -race ./...
      - run: npm ci
        working-directory: Web
      - run: npm test
        working-directory: Web
      - run: npm run build
        working-directory: Web
      - run: npx playwright install --with-deps chromium webkit
        working-directory: Web
      - run: npm run test:e2e
        working-directory: Web
        env:
          WORKLOG_TEST_WEBKIT: '1'
      - name: Real backend adapter integration
        working-directory: Web
        run: |
          node tests/start-backend.js > /tmp/worklog-adapter.log 2>&1 &
          server=$!
          trap 'kill "$server"; wait "$server" || true' EXIT
          ready=false
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:22450/healthz >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/worklog-adapter.log; exit 1; fi
          WORKLOG_TEST_API_URL=http://127.0.0.1:22450/api npm run test:backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: Web/test-results/

  build-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, macos-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select and validate the pushed release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Keep the event tag as the sole version source in this local checkout.
          while IFS= read -r tag; do
            if [ "$tag" != "$RELEASE_TAG" ]; then git tag -d -- "$tag"; fi
          done < <(git tag --list)
          test "v$(bash scripts/release-version.sh)" = "$RELEASE_TAG"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - name: Install Linux packaging dependency
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build Linux packages
        run: bash scripts/build-linux.sh
      - name: Build Windows desktop executable
        run: bash scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-windows
          path: |
            bin/worklog-v*-linux-*.tar.zst
            bin/worklog-v*-windows-*.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, macos-desktop, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if [ "${#assets[@]}" -ne 5 ]; then
            printf 'Expected five release assets (two Linux, two macOS, one Windows).\n' >&2
            exit 1
          fi
          prerelease=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          # Resume interrupted drafts, but never replace already-published assets.
          if state="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"; then
            if [ "$state" != true ]; then
              printf 'Release %s is already published; leaving it unchanged.\n' "$RELEASE_TAG"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --generate-notes --draft "${prerelease[@]}"
          fi
          # Keep the release hidden until every asset has uploaded successfully.
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${prerelease[@]}"
